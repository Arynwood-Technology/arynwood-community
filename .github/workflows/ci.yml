name: CI

# The same checks as the release workflow, on every push to main and every pull request,
# so a broken change shows up before the next release tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.23.4' }
      - name: Backend tests
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m unittest discover -s tests
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Installer scripts parse
        run: bash -n deploy/install.sh deploy/arynwood-grove deploy/upgrade-from-community.sh
