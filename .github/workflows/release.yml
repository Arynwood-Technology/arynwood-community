name: Release

# Pushing a tag v<version> tests, packages and publishes a release. The installer downloads
# install.sh and arynwood-grove.tar.gz (with .sha256) from the latest release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # creates the release
      id-token: write      # the attestation is signed with this run's GitHub identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4' }
      - name: Version matches the tag
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" backend/community/store.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "store.py says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Backend tests
        run: |
          python -m pip install --require-hashes -q -r requirements-dev.lock
          python -m unittest discover -s tests
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend test
      - name: Installer scripts parse
        run: bash -n deploy/install.sh deploy/arynwood-grove deploy/upgrade-from-community.sh
      - name: Package
        run: scripts/package.sh
      # Free provenance in place of a signing key: anyone can check that a file was built here
      # from the tag with `gh attestation verify <file> -R Arynwood-Technology/arynwood-community`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/install.sh
            release/arynwood-grove*.tar.gz
      # The same attestation as a file on the release, so a download can be checked against the release
      # itself: `gh attestation verify <file> --bundle <this file>`. One line: a Sigstore bundle holding a
      # signed SLSA provenance statement. The `.intoto.jsonl` ending is the convention that tools (OpenSSF
      # Scorecard among them) look for. Every published file is checked against it first.
      - name: Provenance file
        env:
          GH_TOKEN: '${{ github.token }}'
          BUNDLE: '${{ steps.attest.outputs.bundle-path }}'
        run: |
          set -euo pipefail
          provenance="release/arynwood-grove-${GITHUB_REF_NAME#v}_provenance.intoto.jsonl"
          cp "$BUNDLE" "$provenance"
          test "$(wc -l < "$provenance")" -eq 1
          for f in release/install.sh release/arynwood-grove*.tar.gz; do
            gh attestation verify "$f" --bundle "$provenance" --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Arynwood Grove ${GITHUB_REF_NAME#v}" --notes-file docs/PRERELEASE.md \
            release/install.sh release/arynwood-grove*.tar.gz release/arynwood-grove*.tar.gz.sha256 \
            release/arynwood-grove-*_provenance.intoto.jsonl
