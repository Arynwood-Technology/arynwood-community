name: Release

# Pushing a tag v<version> tests, packages and publishes a release. The installer downloads
# install.sh and arynwood-grove.tar.gz (with .sha256) from the latest release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # creates the release
      id-token: write      # the attestation is signed with this run's GitHub identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22.23.4' }
      - name: Version matches the tag
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" backend/community/store.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "store.py says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Backend tests
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m unittest discover -s tests
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend test
      - name: Installer scripts parse
        run: bash -n deploy/install.sh deploy/arynwood-grove deploy/upgrade-from-community.sh
      - name: Package
        run: scripts/package.sh
      # Free provenance in place of a signing key: anyone can check that a file was built here
      # from the tag with `gh attestation verify <file> -R Arynwood-Technology/arynwood-community`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/install.sh
            release/arynwood-grove*.tar.gz
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Arynwood Grove ${GITHUB_REF_NAME#v}" --notes-file docs/PRERELEASE.md \
            release/install.sh release/arynwood-grove*.tar.gz release/arynwood-grove*.tar.gz.sha256
